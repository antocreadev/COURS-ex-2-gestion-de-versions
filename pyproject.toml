# ---------------------------------------------------------------------------
# Un seul fichier de configuration pour tout le projet : métadonnées, outils
# de qualité, tests. C'est la convention Python moderne (PEP 621).
# ---------------------------------------------------------------------------

[project]
name = "tp-git"
version = "0.1.0"
description = "Projet support pour apprendre le cycle de contribution (branche, PR, CI, revue, merge)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Équipe pédagogique" }]
keywords = ["pedagogie", "git", "ci", "bonnes-pratiques"]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.16",
  "mypy>=1.11",
  "pre-commit>=4.0",
]

[project.scripts]
tpgit = "tpgit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tpgit"]

# ---------------------------------------------------------------------------
# Tests : pytest + couverture de code
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=tpgit",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]

[tool.coverage.run]
branch = true
source = ["src/tpgit"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------------------------------------------------------------------------
# Ruff : linter + formateur (remplace flake8, isort, black, pyupgrade...)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle  : style PEP 8
  "F",        # pyflakes     : erreurs réelles (variable inutilisée, import mort...)
  "I",        # isort        : ordre des imports
  "UP",       # pyupgrade    : syntaxe Python moderne
  "B",        # bugbear      : pièges classiques
  "SIM",      # simplify     : simplifications de code
  "C4",       # comprehensions
  "RET",      # return       : retours cohérents
  "N",        # pep8-naming  : conventions de nommage
  "PTH",      # pathlib plutôt que os.path
  "ARG",      # arguments non utilisés
  "ANN",      # annotations de type obligatoires
  "D",        # docstrings
  "RUF",      # règles propres à ruff
]
ignore = [
  "D203",  # incompatible avec D211
  "D213",  # incompatible avec D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Dans les tests, on tolère l'absence de docstrings et d'annotations de retour.
"tests/**" = ["D100", "D101", "D102", "D103", "ANN001", "ANN201", "ANN202"]
"scripts/**" = ["D100", "D103"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Mypy : vérification statique des types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
pretty = true
show_error_codes = true
