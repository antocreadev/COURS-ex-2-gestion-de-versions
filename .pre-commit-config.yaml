# Hooks Git gérés par pre-commit (https://pre-commit.com).
#
# Installation (une seule fois par clone) :
#     make hooks
# Exécution manuelle sur tout le dépôt :
#     pre-commit run --all-files
# Mise à jour des versions :
#     pre-commit autoupdate

default_install_hook_types: [pre-commit, commit-msg, pre-push]
fail_fast: false

repos:
  # --- Hygiène générale des fichiers -------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: supprime les espaces en fin de ligne
      - id: end-of-file-fixer
        name: garantit une ligne vide en fin de fichier
      - id: mixed-line-ending
        name: normalise les fins de ligne (LF)
        args: [--fix=lf]
      - id: check-yaml
        name: valide la syntaxe des fichiers YAML
      - id: check-toml
        name: valide la syntaxe des fichiers TOML
      - id: check-merge-conflict
        name: detecte les marqueurs de conflit oublies
      - id: check-added-large-files
        name: refuse les fichiers de plus de 500 ko
        args: [--maxkb=500]
      - id: no-commit-to-branch
        name: interdit de commiter directement sur main
        args: [--branch, main]
        # Uniquement au commit : sans cette ligne, le hook se déclencherait
        # aussi au `git push`, y compris pour le tout premier push de `main`
        # vers un dépôt neuf (celui que fait scripts/creer-mon-depot.sh).
        stages: [pre-commit]

  # --- Qualité du code Python --------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        name: ruff (linter)
        args: [--fix]
      - id: ruff-format
        name: ruff (formateur)

  # --- Hooks locaux -------------------------------------------------------
  - repo: local
    hooks:
      # Ces hooks passent par scripts/dans-le-venv.sh : Git ne lance pas les
      # hooks dans votre shell, il ne voit donc pas l'environnement virtuel que
      # vous avez activé. Le script le retrouve tout seul.
      - id: message-de-commit
        name: valide le format du message de commit
        entry: scripts/dans-le-venv.sh python scripts/verifier_message_commit.py
        language: system
        stages: [commit-msg]

      - id: mypy
        name: mypy (types)
        entry: scripts/dans-le-venv.sh mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest (avant push uniquement)
        entry: scripts/dans-le-venv.sh pytest
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
